name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOLANA_AUTH_SECRET: ci-only-secret-with-at-least-32-characters
      SOLANA_AUTH_ORIGIN: http://localhost:3000
      SOLANA_AUTH_CHAIN_ID: mainnet

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build registry
        run: pnpm registry:build

      - name: Verify generated registry is current
        run: |
          git status --short --untracked-files=all -- public/r
          test -z "$(git status --porcelain --untracked-files=all -- public/r)"

      - name: Build application
        run: pnpm build
